name: Tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
